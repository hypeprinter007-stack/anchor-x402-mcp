name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      # Layer 1: version axes agree. Layer 2: MCP protocol handshake + the
      # 14-tool stdio inventory contract, driven against the real server.
      # Spend-safe — the protocol test spawns with no wallet key + an
      # unroutable API URL, so CI can never move USDC.
      - run: npm test
